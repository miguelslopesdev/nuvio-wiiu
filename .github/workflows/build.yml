name: Build RPX
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm wiiu-dev wiiu-sdl2 wiiu-sdl2_ttf ppc-curl ppc-mbedtls ppc-zlib ppc-freetype
      - name: json.hpp
        run: curl -L -o source/json.hpp https://github.com/nlohmann/json/releases/latest/download/json.hpp
      - name: Compilar
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: nuvio-wiiu
          path: nuvio.rpx
