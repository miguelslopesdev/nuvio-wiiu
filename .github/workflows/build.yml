name: Build RPX
on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          for i in 1 2 3 4 5 6; do
            dkp-pacman -Sy && dkp-pacman -S --noconfirm --needed wut wiiu-sdl2 wiiu-sdl2_ttf wiiu-curl ppc-zlib ppc-freetype && exit 0
            echo "Tentativa $i falhou, esperando..."
            sleep 30
          done
          exit 1
      - name: json.hpp
        run: curl -L -o source/json.hpp https://github.com/nlohmann/json/releases/latest/download/json.hpp
      - name: Compilar
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: nuvio-wiiu
          path: nuvio.rpx
